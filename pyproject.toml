[project]
name = "reportanalyst"
version = "0.1.0"
description = "Annual report to investment thesis analyst: parses filings, computes ratios, and writes grounded analysis memos."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
parse = ["pdfplumber>=0.11"]
rag = ["scikit-learn>=1.4", "numpy>=1.26"]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "pdfplumber>=0.11",
    "scikit-learn>=1.4",
    "numpy>=1.26",
]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "black>=24.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP042"]

[tool.black]
line-length = 100
